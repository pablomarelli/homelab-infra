apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-of-apps
  namespace: argocd
  labels:
    notifications.argocd/channel: none
    notifications.argocd/profile: quiet
spec:
  project: default
  source:
    repoURL: https://github.com/PabloMarelli/homelab-infra.git
    targetRevision: main
    path: apps
    directory:
      # Remove a project's exclusion when re-enabling its manifest.
      exclude: '{finance-manager.yaml,home-assistant.yaml}'
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
