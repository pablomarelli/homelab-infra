apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: repbook
  namespace: repbook
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: repbook
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 8000
