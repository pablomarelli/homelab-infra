# Keep middleware resources in media-share: Traefik disallows cross-namespace
# middleware references. The shared Authentik outpost remains in monitoring.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: external-https-headers
  namespace: media-share
spec:
  headers:
    customRequestHeaders:
      X-Forwarded-Proto: "https"
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authentik-auth
  namespace: media-share
spec:
  forwardAuth:
    address: http://ak-outpost-traefik.monitoring.svc.cluster.local:9000/outpost.goauthentik.io/auth/traefik
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: strip-untrusted-authentik-headers
  namespace: media-share
spec:
  headers:
    customRequestHeaders:
      X-Authentik-Uid: ""
      X-Authentik-Username: ""
      X-Authentik-Email: ""
      X-Authentik-Name: ""
      X-Authentik-Groups: ""
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: easy-media-share
  namespace: media-share
spec:
  entryPoints:
    - web
  routes:
    # Public share pages, downloads, static assets, and availability checks do
    # not pass through Authentik. The application still validates share tokens.
    - match: Host(`share.pablomarelli.dev`) && (PathPrefix(`/s/`) || PathPrefix(`/api/public/`) || PathPrefix(`/assets/`) || Path(`/sw.js`) || Path(`/api/health`))
      kind: Rule
      priority: 200
      services:
        - name: easy-media-share
          port: 8080
    # Every other path is owner-only. Strip client-supplied identity headers
    # before Authentik injects its verified response headers.
    - match: Host(`share.pablomarelli.dev`)
      kind: Rule
      priority: 100
      middlewares:
        - name: strip-untrusted-authentik-headers
        - name: external-https-headers
        - name: authentik-auth
      services:
        - name: easy-media-share
          port: 8080
