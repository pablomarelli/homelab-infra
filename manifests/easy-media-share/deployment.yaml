apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy-media-share
  namespace: media-share
  labels:
    app.kubernetes.io/name: easy-media-share
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: easy-media-share
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easy-media-share
    spec:
      nodeSelector:
        homelab/node-role: worker
        homelab/power: non-ups
        homelab/storage: ssd-1tb
      tolerations:
        - key: homelab/power
          operator: Equal
          value: non-ups
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: easy-media-share
          image: ghcr.io/pablomarelli/easy-media-share:2026.08.26-c3d197f6e4cd7966d528f0b09268e07fc84c3a42
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: AUTH_MODE
              value: authentik
            - name: TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/16
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "2"
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: easy-media-share-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
      terminationGracePeriodSeconds: 60
