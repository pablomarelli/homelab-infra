apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: easy-media-share
  namespace: media-share
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: easy-media-share
      rules:
        - alert: EasyMediaShareUnavailable
          expr: kube_deployment_status_replicas_available{namespace="media-share", deployment="easy-media-share"} < 1
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: Easy Media Share has no available replica
            description: The easy-media-share Deployment has been unavailable for at least 10 minutes.
        - alert: EasyMediaShareStorage70Percent
          expr: |
            100 * kubelet_volume_stats_used_bytes{namespace="media-share", persistentvolumeclaim="easy-media-share-data"}
              / kubelet_volume_stats_capacity_bytes{namespace="media-share", persistentvolumeclaim="easy-media-share-data"} >= 70
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: Easy Media Share storage is at least 70% full
            description: Data storage usage is {{ printf "%.1f" $value }}%.
        - alert: EasyMediaShareStorage85Percent
          expr: |
            100 * kubelet_volume_stats_used_bytes{namespace="media-share", persistentvolumeclaim="easy-media-share-data"}
              / kubelet_volume_stats_capacity_bytes{namespace="media-share", persistentvolumeclaim="easy-media-share-data"} >= 85
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Easy Media Share storage is at least 85% full
            description: Data storage usage is {{ printf "%.1f" $value }}% and requires attention.
        - alert: EasyMediaShareStorage95Percent
          expr: |
            100 * kubelet_volume_stats_used_bytes{namespace="media-share", persistentvolumeclaim="easy-media-share-data"}
              / kubelet_volume_stats_capacity_bytes{namespace="media-share", persistentvolumeclaim="easy-media-share-data"} >= 95
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: Easy Media Share storage is at least 95% full
            description: Data storage usage is {{ printf "%.1f" $value }}%; uploads may fail imminently.
