apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: easy-media-share-ingress
  namespace: media-share
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: easy-media-share
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - port: 8080
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 8080
          protocol: TCP
