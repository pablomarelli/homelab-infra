apiVersion: v1
kind: ConfigMap
metadata:
  name: easy-media-share-storage-metrics
  namespace: media-share
data:
  collect.sh: |
    #!/bin/sh
    set -eu
    while true; do
      if usage=$(du -sk /data) && filesystem=$(df -Pk /data | tail -n 1); then
        set -- $usage
        used_bytes=$(($1 * 1024))
        set -- $filesystem
        size_bytes=$(($2 * 1024))
        available_bytes=$(($4 * 1024))
        {
          printf '# HELP easy_media_share_data_bytes Allocated disk bytes in the media data directory.\n'
          printf '# TYPE easy_media_share_data_bytes gauge\n'
          printf 'easy_media_share_data_bytes %s\n' "$used_bytes"
          printf '# HELP easy_media_share_filesystem_size_bytes Size of the filesystem hosting media data.\n'
          printf '# TYPE easy_media_share_filesystem_size_bytes gauge\n'
          printf 'easy_media_share_filesystem_size_bytes %s\n' "$size_bytes"
          printf '# HELP easy_media_share_filesystem_available_bytes Bytes available on the filesystem hosting media data.\n'
          printf '# TYPE easy_media_share_filesystem_available_bytes gauge\n'
          printf 'easy_media_share_filesystem_available_bytes %s\n' "$available_bytes"
          printf '# HELP easy_media_share_storage_scan_timestamp_seconds Last successful directory scan time.\n'
          printf '# TYPE easy_media_share_storage_scan_timestamp_seconds gauge\n'
          printf 'easy_media_share_storage_scan_timestamp_seconds %s\n' "$(date +%s)"
        } > /metrics/metrics.tmp
        mv /metrics/metrics.tmp /metrics/metrics.txt
      else
        echo 'Storage usage scan failed' >&2
      fi
      sleep 300
    done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: easy-media-share-storage-metrics
  namespace: media-share
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: easy-media-share-storage-metrics
  template:
    metadata:
      labels:
        app.kubernetes.io/name: easy-media-share-storage-metrics
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: homelab-desktop-01
      tolerations:
        - key: homelab/power
          operator: Equal
          value: non-ups
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: collector
          image: busybox:1.37
          command: [sh, /scripts/collect.sh]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: metrics
              mountPath: /metrics
            - name: scripts
              mountPath: /scripts
              readOnly: true
        - name: http
          image: busybox:1.37
          command: [httpd, -f, -p, '9101', -h, /metrics]
          ports:
            - name: metrics
              containerPort: 9101
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          readinessProbe:
            httpGet:
              path: /metrics.txt
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
          volumeMounts:
            - name: metrics
              mountPath: /metrics
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: easy-media-share-data
            readOnly: true
        - name: metrics
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: scripts
          configMap:
            name: easy-media-share-storage-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: easy-media-share-storage-metrics
  namespace: media-share
  labels:
    app.kubernetes.io/name: easy-media-share-storage-metrics
spec:
  selector:
    app.kubernetes.io/name: easy-media-share-storage-metrics
  ports:
    - name: metrics
      port: 9101
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: easy-media-share-storage-metrics
  namespace: media-share
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: easy-media-share-storage-metrics
  endpoints:
    - port: metrics
      path: /metrics.txt
      interval: 60s
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: easy-media-share-storage-metrics
  namespace: media-share
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: easy-media-share-storage-metrics
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9101
          protocol: TCP
