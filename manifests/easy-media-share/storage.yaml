apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: easy-media-share-local
provisioner: kubernetes.io/no-provisioner
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: easy-media-share-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  capacity:
    storage: 250Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: easy-media-share-local
  claimRef:
    namespace: media-share
    name: easy-media-share-data
  local:
    path: /srv/easy-media-share/data
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - homelab-desktop-01
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: easy-media-share-data
  namespace: media-share
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  volumeMode: Filesystem
  storageClassName: easy-media-share-local
  volumeName: easy-media-share-data
  resources:
    requests:
      storage: 250Gi
