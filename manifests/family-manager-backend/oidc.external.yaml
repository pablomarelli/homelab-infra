apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-manager-oidc
  namespace: family-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: family-manager-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-id
      remoteRef:
        key: Family Manager OIDC/client-id
    - secretKey: client-secret
      remoteRef:
        key: Family Manager OIDC/client-secret
