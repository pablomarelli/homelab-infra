apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-manager-ghcr
  namespace: family-manager
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: onepassword
    kind: ClusterSecretStore
  target:
    name: family-manager-ghcr
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: Family Manager GHCR/dockerconfigjson
