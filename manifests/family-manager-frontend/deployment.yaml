apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-manager-frontend
  namespace: family-manager
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: family-manager-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: family-manager-frontend
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        homelab/power: battery-backed
      imagePullSecrets:
        - name: family-manager-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/pablomarelli/family-manager-frontend:0.1.1
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 32Mi
