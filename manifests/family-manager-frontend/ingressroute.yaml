apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: family-manager-frontend
  namespace: family-manager
spec:
  entryPoints: [web]
  routes:
    - match: Host(`family.pablomarelli.dev`)
      kind: Rule
      priority: 10
      services:
        - name: family-manager-frontend
          port: 8080
