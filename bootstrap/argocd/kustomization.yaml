apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - install.yaml
patches:
  # These are owned by the argocd-notifications Application and External Secrets.
  # Upstream's empty placeholders must not take ownership during bootstrap updates.
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-notifications-cm
      $patch: delete
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: argocd-notifications-secret
      $patch: delete
